---
layout: default
---
<article class="content-page{% if page.page_class %} {{ page.page_class }}{% endif %}">
  <header class="page-hero{% if page.hero_image %} page-hero-visual{% endif %}">
    <div class="container{% if page.hero_image %} page-hero-grid{% endif %}">
      <div class="page-hero-copy">
        {% if page.eyebrow %}<p class="eyebrow">{{ page.eyebrow }}</p>{% endif %}
        <h1>{{ page.title }}</h1>
        {% if page.intro %}<p class="page-lead">{{ page.intro }}</p>{% endif %}
      </div>
      {% if page.hero_image %}
      <figure class="page-hero-art" aria-hidden="true">
        <img src="{{ page.hero_image | relative_url }}" width="1200" height="800" alt="" fetchpriority="high" decoding="async">
      </figure>
      {% endif %}
    </div>
  </header>
  <div class="page-content container">{{ content }}</div>
</article>
