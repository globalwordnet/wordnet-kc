# Site settings
title: "Wordnet CLARIN K-Center"
description: "CLARIN Knowledge Centre for Wordnet Technologies and Resources"
baseurl: "" # the subpath of your site, e.g. /blog
url: "https://wordnet-kc.github.io" # the base hostname & protocol for your site

# Build settings
markdown: kramdown
highlighter: rouge
permalink: pretty

# Collections
collections:
  tools:
    output: true
    permalink: /:collection/:name/
  resources:
    output: true
    permalink: /:collection/:name/

# Plugins
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag

# Exclude from processing
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  - README.md

# Site configuration
google_analytics: # Add your GA tracking ID if needed
contact_email: "contact@wordnet-kc.org"

# Navigation
navigation:
  - title: "Home"
    url: "/"
  - title: "About"
    url: "/#about"
  - title: "Expertise"
    url: "/#expertise"
  - title: "Tools & Resources"
    url: "/#tools"
  - title: "Team"
    url: "/#team"
  - title: "Contact"
    url: "/#contact"

# Social links
social:
  github: "wordnet-kc"
  email: "contact@wordnet-kc.org"
