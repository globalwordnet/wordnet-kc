# Site settings
title: "Wordnet Knowledge Centre"
description: "Expert support for wordnets, lexical resources and semantic networks across languages and research domains."
baseurl: "" # the subpath of your site, e.g. /blog
url: "https://wordnet-kc.github.io" # the base hostname & protocol for your site

# Build settings
markdown: kramdown
highlighter: rouge
permalink: pretty

# Collections
collections:
  tools:
    output: true
    permalink: /:collection/:name/
  resources:
    output: true
    permalink: /:collection/:name/

# Plugins
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag

# Exclude from processing
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  - README.md
  - AUDIT_TODO.md
  - setup_script.sh

# Site configuration
google_analytics: # Add your GA tracking ID if needed
contact_email: "wordnet-kc@clarin-pl.eu"
certification_status: "pending"
helpdesk_response: "within two working days"

# Navigation
navigation:
  - title: "About"
    url: "/#about"
  - title: "Expertise"
    url: "/#expertise"
  - title: "Knowledge"
    url: "/#knowledge"
  - title: "Tools"
    url: "/#resources"
  - title: "Team"
    url: "/#team"
  - title: "Helpdesk"
    url: "/helpdesk/"

# Social links
social:
  github: "wordnet-kc"
  email: "wordnet-kc@clarin-pl.eu"
